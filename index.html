<style>
:root{
  --green:#0b7d40; --green-d:#08602f; --green-50:#e8f5ec; --green-100:#cfe9d7;
  --char:#24282d; --char-2:#3a4048; --char-50:#eef0f2;
  --paper:#f3f5f4; --card:#fff; --line:#e1e5e3; --text:#1d2226; --muted:#5d6670;
  --red:#c0352b; --red-50:#fdf0ee; --amber:#94590a; --amber-50:#fff5e3;
  --r:16px; --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 14px rgba(20,30,25,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--paper);color:var(--text);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0)}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:3px solid #6cc28f;outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* 머리글: 흰 바탕 + 학교 로고 + 초록·검정 띠 */
.top{background:#fff;position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0);box-shadow:0 1px 0 var(--line)}
.top:after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--green) 0 62%,var(--char) 62% 100%)}
.top .in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.top .logo{width:46px;height:46px;flex-shrink:0;display:block}
.top .ttl{flex:1;min-width:0}
.top .school{font-size:12.5px;color:var(--muted);letter-spacing:.01em}
.top h1{margin:0;font-size:18.5px;font-weight:800;color:var(--char);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 em{font-style:normal;color:var(--green)}
.top .who{font-size:13.5px;text-align:right;color:var(--char-2);line-height:1.35;flex-shrink:0}
.top .who button{background:var(--char-50);border:0;color:var(--char-2);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;margin-top:4px;cursor:pointer}

main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h2{font-size:19px;margin:4px 0 14px;color:var(--char);letter-spacing:-.02em}
h3{font-size:15px;margin:26px 0 10px;color:var(--char);display:flex;align-items:center;gap:8px}
.cnt{background:var(--char);color:#fff;border-radius:999px;font-size:12px;padding:0 9px;line-height:21px;font-weight:700}
.muted{color:var(--muted);font-size:14px}

/* 버튼 */
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:48px;font-size:16px;color:var(--char)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 2px 8px rgba(11,125,64,.22)}
.btn.primary:hover{background:var(--green-d)}
.btn.primary:disabled{background:#a7cdb6;border-color:#a7cdb6;box-shadow:none;cursor:not-allowed}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);font-weight:600}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}

/* 큰 선택 카드 */
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice button{position:relative;border:0;border-radius:20px;padding:18px 16px;cursor:pointer;color:#fff;text-align:left;min-height:156px;
  display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);overflow:hidden}
.choice button:active{transform:scale(.985)}
.choice .ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.choice .ic svg{width:26px;height:26px}
.choice b{font-size:23px;letter-spacing:-.02em;display:block}
.choice span.s{font-size:13.5px;opacity:.88}
.choice button:after{content:"›";position:absolute;right:16px;top:12px;font-size:30px;opacity:.55;line-height:1}
.c-stu,.c-out{background:linear-gradient(150deg,#0f8c49,#0a6a37)}
.c-tea,.c-night{background:linear-gradient(150deg,#353b43,#1f2328)}

/* 카드·입력 */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;box-shadow:var(--shadow)}
.f{margin-bottom:16px}
.f label{display:block;font-weight:700;font-size:14.5px;margin-bottom:6px;color:var(--char)}
.f input,.f select,.f textarea{width:100%;border:1.5px solid #d3d9d6;border-radius:12px;padding:12px 13px;background:#fff;min-height:50px;font-size:16px;transition:border-color .15s}
.f input:focus,.f textarea:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px var(--green-50)}
.f textarea{min-height:96px;resize:vertical}
.f .hint{font-size:13px;color:var(--muted);margin-top:5px}
.rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rooms button{border:1.5px solid #d3d9d6;background:#fff;border-radius:12px;min-height:52px;font-weight:800;font-size:16px;cursor:pointer;color:var(--char)}
.rooms button.on{background:var(--green);border-color:var(--green);color:#fff}
.check{display:flex;gap:12px;align-items:flex-start;background:var(--amber-50);border:2px solid #f0cf94;border-radius:14px;padding:15px;cursor:pointer;margin-bottom:16px}
.check input{width:26px;height:26px;flex-shrink:0;margin:0;accent-color:var(--green)}
.check b{color:var(--amber);font-size:16px}
.check.ok{border-color:var(--green);background:var(--green-50)}
.check.ok b{color:var(--green-d)}
.steps{display:flex;gap:6px;margin:-2px 0 14px;font-size:12.5px;font-weight:700;color:#9aa3ab}
.steps span{flex:1;padding-top:7px;border-top:4px solid var(--line)}
.steps span.on{color:var(--green);border-top-color:var(--green)}

.summary{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:0 0 16px;box-shadow:var(--shadow)}
.summary div{display:flex;padding:13px 16px;border-bottom:1px solid var(--line)}
.summary div:last-child{border-bottom:0}
.summary dt{width:92px;color:var(--muted);flex-shrink:0}
.summary dd{margin:0;font-weight:700}
.done{text-align:center;padding:30px 16px}
.done .mark{width:68px;height:68px;border-radius:50%;background:var(--green);color:#fff;font-size:34px;line-height:68px;margin:0 auto 14px;box-shadow:0 6px 18px rgba(11,125,64,.3)}

.hello{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.hello .av{width:46px;height:46px;border-radius:50%;background:var(--green-50);color:var(--green);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.hello b{font-size:17px;color:var(--char)}

/* 목록 */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.tag{display:inline-block;font-size:12.5px;font-weight:800;padding:2px 9px;border-radius:999px;margin-right:6px;vertical-align:1px}
.tag.out{background:var(--green-50);color:var(--green)}
.tag.night{background:var(--char-50);color:var(--char)}
.tag.cancel{background:#eef0f2;color:#8a939b}
.empty{background:var(--card);border:1.5px dashed #d3d9d6;border-radius:var(--r);padding:20px;text-align:center;color:var(--muted);font-size:15px}
.err{background:var(--red-50);color:var(--red);border-radius:12px;padding:12px 14px;font-weight:700;margin-bottom:14px;font-size:15px}
.warn{background:var(--amber-50);color:var(--amber);border-radius:12px;padding:11px 14px;font-size:14px;font-weight:700;margin-bottom:14px}

/* 교사 화면 */
.tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--char-50);padding:4px;border-radius:14px}
.tabs button{flex:1;border:0;background:none;min-height:42px;border-radius:10px;font-weight:700;color:var(--char-2);cursor:pointer;font-size:14.5px}
.tabs button.on{background:#fff;color:var(--char);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.datebar{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center}
.datebar input{border:1.5px solid #d3d9d6;border-radius:12px;padding:8px 10px;min-height:46px;font-size:16px;width:100%;background:#fff;text-align:center}
.datebar2{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
.bigdate{font-size:23px;font-weight:800;color:var(--char);margin:18px 0 8px;letter-spacing:-.02em}
.bigdate small{font-size:13px;font-weight:800;color:#fff;background:var(--green);border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 2px}
.stats div{border-radius:var(--r);padding:14px 16px;color:#fff;box-shadow:var(--shadow);font-weight:700}
.stats b{font-size:34px;display:block;line-height:1.05;font-weight:800}
.stats .n1{background:linear-gradient(150deg,#353b43,#1f2328)}
.stats .n2{background:linear-gradient(150deg,#0f8c49,#0a6a37)}
.people{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.person{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.person .rm{font-weight:800;font-size:14px;min-width:48px;text-align:center;background:var(--char-50);color:var(--char);border-radius:10px;padding:6px 0}
.person .info{flex:1;min-width:0}
.person .info b{font-size:16.5px;color:var(--char)}
.person .info div{color:var(--char-2);font-size:15px;word-break:keep-all;overflow-wrap:anywhere;margin-top:1px}
.person .x{background:none;border:0;color:#8a939b;font-size:13px;padding:6px 2px;cursor:pointer}
details summary{cursor:pointer;color:var(--muted);font-size:14px}
.foot{text-align:center;color:#9aa3ab;font-size:12px;margin-top:32px}

/* 확인창·로딩 */
#sheet{position:fixed;inset:0;background:rgba(20,26,30,.48);display:none;align-items:flex-end;justify-content:center;z-index:60}
#sheet.on{display:flex}
#sheet .box{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:24px 18px calc(18px + env(safe-area-inset-bottom,0))}
#sheet .msg{font-size:17px;font-weight:700;margin:0 0 20px;white-space:pre-line;color:var(--char)}
#sheet .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#sheet .acts.one{grid-template-columns:1fr}
@media(min-width:600px){#sheet{align-items:center}#sheet .box{border-radius:22px}}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;align-items:center;justify-content:center;z-index:50}
#busy.on{display:flex}
.spin{width:40px;height:40px;border:4px solid var(--green-100);border-top-color:var(--green);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
@media(max-width:599px){.wide{display:none}}
@media(max-width:360px){.top h1{font-size:16.5px}.choice b{font-size:20px}.top .logo{width:40px;height:40px}}
@media print{.top .who,.noprint{display:none!important}body{background:#fff}main{padding:0}.people,.stats div{box-shadow:none}.top{position:static}}

/* v2 출입/보호자 알림 */
.move{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.move .btn{font-size:13px;padding:8px 10px}.state{display:inline-block;margin-left:6px;padding:3px 7px;border-radius:999px;font-size:12px;font-weight:800}.state.wait{background:#fff4cf;color:#8a6300}.state.away{background:#ffe0e0;color:#b42318}.state.done{background:#dcfce7;color:#166534}.notify{font-size:12px;color:var(--muted);margin-top:4px}.contacts .row{align-items:center}.contacts input{max-width:180px}.contact-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.privacy{background:#f7f9fb;border:1px solid var(--line);padding:12px 14px;border-radius:12px;margin-bottom:14px}.person .info{min-width:0}.person .info .reason{color:var(--muted);font-size:13px;margin-top:2px}
</style>

<script>
/* ===== 설정: Apps Script 웹앱 주소 (배포 관리 → 새 버전으로 배포하면 주소 유지) ===== */
// 아래 주소를 v3 Apps Script 웹앱 배포 주소로 바꾸세요.
const API_URL = 'https://script.google.com/macros/s/AKfycbxq3DnaysyTpghlxW77siSYXqDUJHy73rRpJCxLquPqWzRrRD0s8rTHirE2a4bOKYeZlQ/exec';

let BOOT = null, TOKEN = '', ME = null, FORM = {}, TDATE = '', TTAB = 'day', LOADED = 0;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD = '일월화수목금토';
function fdate(s) { const m = String(s || '').match(/(\d{4})-(\d{2})-(\d{2})/); if (!m) return esc(s); const d = new Date(+m[1], +m[2] - 1, +m[3]); return `${+m[2]}월 ${+m[3]}일 (${WD[d.getDay()]})`; }
function shiftDate(s, n) { const m = s.match(/(\d{4})-(\d{2})-(\d{2})/); const d = new Date(+m[1], +m[2] - 1, +m[3] + n); const p = x => ('0' + x).slice(-2); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }
// 로그인 토큰은 휴대폰에 보관합니다. 실제 만료는 서버가 관리합니다(학생 기본 30일, 교사 기본 12시간).
function store(k, v) {
  [window.localStorage, window.sessionStorage].forEach(st => { try { v === null ? st.removeItem('dorm_' + k) : st.setItem('dorm_' + k, v); } catch (e) {} });
}
function stored(k) {
  for (const st of [window.localStorage, window.sessionStorage]) { try { const v = st.getItem('dorm_' + k); if (v) return v; } catch (e) {} }
  return null;
}
/* 휴대폰용 확인창 (alert·confirm 대신: 카카오톡 등 앱 내 브라우저에서도 동작) */
function ask(msg, okLabel, danger) {
  return new Promise(res => {
    $('#sMsg').textContent = msg;
    const a = $('#sActs'); a.className = 'acts'; a.innerHTML = '';
    const no = document.createElement('button'); no.className = 'btn'; no.textContent = '아니오';
    const ok = document.createElement('button'); ok.className = 'btn ' + (danger ? 'danger' : 'primary'); ok.textContent = okLabel || '확인';
    no.onclick = () => { $('#sheet').classList.remove('on'); res(false); };
    ok.onclick = () => { $('#sheet').classList.remove('on'); res(true); };
    a.appendChild(no); a.appendChild(ok); $('#sheet').classList.add('on');
  });
}
function notice(msg) {
  return new Promise(res => {
    $('#sMsg').textContent = msg;
    const a = $('#sActs'); a.className = 'acts one'; a.innerHTML = '';
    const ok = document.createElement('button'); ok.className = 'btn primary'; ok.textContent = '확인';
    ok.onclick = () => { $('#sheet').classList.remove('on'); res(true); };
    a.appendChild(ok); $('#sheet').classList.add('on');
  });
}
/* 휴대폰 뒤로가기: 앱이 닫히지 않고 이전(첫) 화면으로 */
function sub() { try { if (!history.state || !history.state.sub) history.pushState({ sub: 1 }, ''); } catch (e) {} }
function top_() { try { history.replaceState({ root: 1 }, ''); } catch (e) {} }
window.addEventListener('popstate', () => {
  if ($('#sheet').classList.contains('on')) { $('#sheet').classList.remove('on'); }
  const role = TOKEN ? stored('role') : '';
  if (role === 'student') studentHome(); else if (role === 'teacher') teacherHome(); else home();
});
function remember(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function recall(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }

// Apps Script API 호출 (text/plain POST: 브라우저 사전 확인 요청 없이 전송, Google 로그인 정보 미전송)
async function call(fn, ...args) {
  $('#busy').classList.add('on');
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 30000);
  try {
    let res;
    try {
      res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn, args }), redirect: 'follow', credentials: 'omit', signal: ctrl.signal });
    } catch (e) {
      throw new Error(e.name === 'AbortError' ? '응답이 늦습니다. 잠시 후 다시 눌러 주세요.' : '인터넷 연결을 확인한 뒤 다시 눌러 주세요.');
    }
    let j;
    try { j = await res.json(); } catch (e) { throw new Error('서버 응답을 읽지 못했습니다. 잠시 후 다시 시도하세요.'); }
    if (!j.ok) {
      const msg = String(j.error || '오류가 발생했습니다.');
      if (msg.indexOf('SESSION_EXPIRED') >= 0) { logout(true); notice('로그인이 해제되었습니다. 다시 접속하세요.'); throw new Error('로그인이 해제되었습니다.'); }
      throw new Error(msg);
    }
    return j.data;
  } catch (e) {
    throw (e && e.message) ? e.message : String(e);
  } finally {
    clearTimeout(timer);
    $('#busy').classList.remove('on');
  }
}
function render(h) { $('#app').innerHTML = h; window.scrollTo(0, 0); }
function showErr(msg) { const b = $('#errbox'); if (b) { b.textContent = msg; b.style.display = 'block'; b.scrollIntoView({ block: 'center' }); } else notice(String(msg)); }
function setWho(html) { $('#who').innerHTML = html; }
const ICON = {

function ttabs() {

function movementState(r) {

function notifyBadge(v) {

  return `<span class="state" style="background:#fdecec;color:#b42318">알림 ${esc(v)}</span>`;
}
function retryButton(r, event) {
  const v = event === 'depart' ? r.departNotify : r.returnNotify;
  const hasTime = event === 'depart' ? r.departedAt : r.returnedAt;
  if (!hasTime || !v || v === '성공' || v === '테스트') return '';
  const label = event === 'depart' ? '출발 알림 다시 보내기' : '귀사 알림 다시 보내기';
  return `<button class="btn sm" data-id="${esc(r.id)}" data-event="${event}" data-nm="${esc(r.name)}" onclick="retryNotify(this.dataset.id,this.dataset.event,this.dataset.nm)">${label}</button>`;
}
function tableOf(rows) {
  if (!rows.length) return `<div class="empty">없음</div>`;
  return `<div class="people">${rows.map(r => `<div class="person"><div class="rm num">${esc(r.room)}호</div>
    <div class="info"><b>${esc(r.name)}</b>${movementState(r)}<div class="reason">${esc(r.reason)}</div>
      <div class="notify">${r.departedAt ? '출발 '+esc(r.departedAt)+' '+notifyBadge(r.departNotify) : ''}${r.returnedAt ? '<br>귀사 '+esc(r.returnedAt)+' '+notifyBadge(r.returnNotify) : ''}</div>
      <div class="move noprint">

      </div></div></div>`).join('')}</div>`;
}
async function movement(id, action, name) {
  const word = action === 'depart' ? '출발' : '귀사';
  if (!(await ask(name + ' 학생의 실제 ' + word + '을 확인했습니까?\n확인 시각이 기록되고 보호자 알림이 처리됩니다.', word + ' 확인', false))) return;
  try {
    const r = await call('apiMovement', TOKEN, id, action);
    await notice(word + ' 처리 완료\n보호자 알림: ' + (r.notify || '확인 필요'));

  } catch (e) { notice(String(e)); }
}
async function retryNotify(id,event,name) {
  const word = event === 'depart' ? '출발' : '귀사';
  if (!(await ask(name + ' 학생의 ' + word + ' 알림을 다시 처리할까요?\n이미 정상 발송된 알림은 서버가 중복 전송을 막습니다.', '다시 보내기', false))) return;
  try { const r=await call('apiNotifyRetry',TOKEN,id,event); await notice('알림 처리 결과: '+(r.notify||'확인 필요')); teacherDay(TDATE); }
  catch(e){ notice(String(e)); }
}

    ${d.notify && d.notify.mode === 'WEBHOOK' && !d.notify.configured ? `<div class="warn noprint"><b>알림 설정 확인 필요</b><br>WEBHOOK 모드이지만 알림WebhookURL이 비어 있습니다.</div>` : ''}
    <div class="privacy noprint"><b>보호자 자동 안내</b><br><span class="muted">[출발 확인]과 [귀사 확인]은 실제 확인 후 눌러 주세요. 처리 중 중복 클릭은 서버에서 차단하며, 알림 실패 시 [알림 다시 보내기]가 표시됩니다.</span></div>

async function tCancel(id, name) {

  try { list = await call('apiRoster', TOKEN); } catch (e) { if (TOKEN) render(ttabs() + `<div class="err">${esc(e)}</div>`); return; }
  const reg = list.filter(s => s.registered).length;
  render(ttabs() + `<p class="muted" style="margin-top:0">비밀번호 등록 ${reg} / ${list.length}명 · 최초 접속 또는 비밀번호 초기화 후에는 1회용 초기 PIN이 필요합니다.</p>
    ${list.length ? `<div class="list">${list.map(s => `<div class="row"><div class="main"><b>${esc(s.room)}호실 ${esc(s.name)}</b>
      <div class="muted">${s.registered ? '비밀번호 등록됨' : '비밀번호 미등록'}${s.pin ? ' · 초기 PIN '+esc(s.pin) : ''}${s.guardianMasked ? ' · 보호자 '+esc(s.guardianMasked) : ' · 보호자 번호 미등록'}</div></div>
      <button class="btn sm" data-r="${esc(s.room)}" data-n="${esc(s.name)}" onclick="issuePin(this.dataset.r,this.dataset.n)">${s.registered ? '비밀번호 초기화' : '초기 PIN 발급'}</button></div>`).join('')}</div>`
      : '<div class="empty">학생명부 시트에 호실과 이름을 입력하세요.</div>'}`);
}
async function issuePin(room, name) {
  if (!(await ask(room + '호실 ' + name + ' 학생에게 새 초기 PIN을 발급할까요?\n기존 비밀번호가 있으면 초기화됩니다.', 'PIN 발급', true))) return;
  try { const r=await call('apiIssuePin',TOKEN,room,name); await notice(name+' 학생 초기 PIN: '+r.pin+'\n학생에게 직접 전달해 주세요. 최초 비밀번호 등록 후 PIN은 자동 폐기됩니다.'); teacherRoster(); }
  catch(e){ notice(String(e)); }
}
async function resetPw(room, name) { return issuePin(room,name); }
async function teacherContacts() {
  TTAB='contacts'; let list;
  try { list=await call('apiGuardianRoster',TOKEN); } catch(e){ render(ttabs()+`<div class="err">${esc(e)}</div>`); return; }
  render(ttabs()+`<div class="privacy"><b>보호자 연락처 관리</b><br><span class="muted">보호자 전화번호는 GitHub 소스에는 포함되지 않고 Google 스프레드시트에 저장됩니다. 교사 로그인 후 이 화면에서만 조회·수정할 수 있습니다. 하이픈 없이 입력해도 됩니다.</span></div>
    <div class="list contacts">${list.map((s,i)=>`<div class="row"><div class="main"><b>${esc(s.room)}호실 ${esc(s.name)}</b>
      <div class="contact-line"><input id="gp${i}" type="tel" inputmode="numeric" value="${esc(s.phone)}" placeholder="01012345678" autocomplete="off">
      <button class="btn sm primary" data-i="${i}" data-r="${esc(s.room)}" data-n="${esc(s.name)}" onclick="saveGuardian(this.dataset.i,this.dataset.r,this.dataset.n)">저장</button></div></div></div>`).join('')}</div>`);
}
async function saveGuardian(i,room,name) {
  const phone=$('#gp'+i).value.trim();
  try { await call('apiGuardianSave',TOKEN,room,name,phone); await notice(name+' 학생 보호자 연락처를 저장했습니다.'); } catch(e){ notice(String(e)); }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && TOKEN && stored('role') === 'teacher' && TTAB === 'day' && Date.now() - LOADED > 60000 && !$('#sheet').classList.contains('on')) teacherDay(TDATE);
});
init();
</script>
